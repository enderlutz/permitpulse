name: Geocode 99% — Three-Layer Pass

# Three-layer geocoding push:
#   1. geocode_retry  — clean addresses (strip unit numbers, parentheticals) and
#                       retry Census. Recovers most cases Census mis-parsed.
#   2. geocode_nominatim — OpenStreetMap fallback for what Census still misses
#                          (new subdivisions etc.). 1 req/sec, slow but free.
#   3. geocode_zip_centroid — last-resort ZIP-centroid pin so map shows every
#                             permit. Tagged geo_precision='zip' so frontend
#                             can render them differently from rooftop matches.

on:
  workflow_dispatch:
    inputs:
      layers:
        description: 'Layers to run: "all", "1", "1,2", "2,3", etc.'
        required: false
        default: "all"
      limit_nominatim:
        description: "Cap Nominatim attempts (slow at 1 req/sec)"
        required: false
        default: "5000"
      concurrency:
        description: "Census batch concurrency (Layer 1)"
        required: false
        default: "1"

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-run coverage
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          from sqlalchemy import text
          from db import engine
          with engine.connect() as c:
              n = c.execute(text(\"SELECT COUNT(*) FROM permits WHERE latitude IS NOT NULL\")).scalar()
              t = c.execute(text(\"SELECT COUNT(*) FROM permits\")).scalar()
              print(f'Before — geocoded: {n}/{t} ({100*n/t:.1f}%)')"

      - name: Layer 1 — Census retry with cleaned addresses
        if: ${{ contains(github.event.inputs.layers || 'all', '1') || github.event.inputs.layers == 'all' }}
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.geocode_retry

      - name: Layer 2 — Nominatim fallback
        if: ${{ contains(github.event.inputs.layers || 'all', '2') || github.event.inputs.layers == 'all' }}
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          LIMIT="${{ github.event.inputs.limit_nominatim || '5000' }}"
          python -m scripts.geocode_nominatim --limit "$LIMIT"

      - name: Layer 3 — ZIP-centroid pin for the remainder
        if: ${{ contains(github.event.inputs.layers || 'all', '3') || github.event.inputs.layers == 'all' }}
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.geocode_zip_centroid

      - name: Post-run coverage
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          from sqlalchemy import text
          from db import engine
          with engine.connect() as c:
              n = c.execute(text(\"SELECT COUNT(*) FROM permits WHERE latitude IS NOT NULL\")).scalar()
              t = c.execute(text(\"SELECT COUNT(*) FROM permits\")).scalar()
              print(f'After — geocoded: {n}/{t} ({100*n/t:.1f}%)')
              print()
              print('By precision:')
              for r in c.execute(text(\"SELECT COALESCE(geo_precision, 'untagged'), COUNT(*) FROM permits WHERE latitude IS NOT NULL GROUP BY 1 ORDER BY 2 DESC\")):
                  print(f'  {r[0]:10s} {r[1]:,}')"
