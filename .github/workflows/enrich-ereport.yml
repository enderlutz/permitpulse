name: Enrich eReport Rows (builder + value)

# Walks every eReport-sourced permit row (which has correct permit_date from
# the city's weekly xlsx but no builder/value) and fills builder + project_value
# via the sold_permit_d drill-down. Tries common sub-permit codes (PX, 13, BU,
# 11, 12, 14, ...) until one returns a Project Details page.
#
# Idempotent: only NULL fields are written, so re-running is safe.

on:
  workflow_dispatch:
    inputs:
      since_id:
        description: "Start from permits.id > N (resume / parallelize). Blank = from beginning."
        required: false
        default: ""
      limit:
        description: "Cap rows processed this run."
        required: false
        default: ""
      concurrency:
        description: "Parallel drill-down requests"
        required: false
        default: "6"

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-run row counts
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          from sqlalchemy import text
          from db import engine
          with engine.connect() as c:
              total = c.execute(text(\"SELECT COUNT(*) FROM permits WHERE source='houston_ereport' AND (builder IS NULL OR project_value IS NULL)\")).scalar()
              with_builder = c.execute(text(\"SELECT COUNT(*) FROM permits WHERE source='houston_ereport' AND builder IS NOT NULL\")).scalar()
              print(f'Before run — eReport rows needing enrichment: {total}, already have builder: {with_builder}')
          "

      - name: Run enrichment
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          SINCE="${{ github.event.inputs.since_id }}"
          LIMIT="${{ github.event.inputs.limit }}"
          CONC="${{ github.event.inputs.concurrency || '6' }}"

          ARGS=(--concurrency "$CONC")
          if [ -n "$SINCE" ]; then ARGS+=(--since-id "$SINCE"); fi
          if [ -n "$LIMIT" ]; then ARGS+=(--limit "$LIMIT"); fi

          echo "→ Running: python -m scripts.enrich_ereport ${ARGS[@]}"
          python -m scripts.enrich_ereport "${ARGS[@]}"

      - name: Post-run row counts
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          from sqlalchemy import text
          from db import engine
          with engine.connect() as c:
              total = c.execute(text(\"SELECT COUNT(*) FROM permits WHERE source='houston_ereport'\")).scalar()
              with_builder = c.execute(text(\"SELECT COUNT(*) FROM permits WHERE source='houston_ereport' AND builder IS NOT NULL\")).scalar()
              with_value = c.execute(text(\"SELECT COUNT(*) FROM permits WHERE source='houston_ereport' AND project_value IS NOT NULL\")).scalar()
              print(f'After run — eReport rows: {total}, with builder: {with_builder} ({100*with_builder/max(total,1):.1f}%), with project_value: {with_value} ({100*with_value/max(total,1):.1f}%)')
          "
