name: Harris County Permit Refresh

# Nightly refresh of unincorporated Harris County permits. Pulls newly issued
# permits (recent-window, idempotent) and re-runs HCAD appraisal enrichment so
# owner + property value progressively fill in as the appraisal roll catches
# up to new construction. This is the "enriches over time" job.
#
# Harris sources are plain REST (requests) — no Playwright/browser needed, so
# this runs in a couple of minutes.
#
# Setup (one time): Settings -> Secrets -> Actions -> DATABASE_URL (Supabase
# session-pooler connection string). Same secret the daily Houston scrape uses.

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC nightly (after the 10:00 Houston scrape)
  workflow_dispatch:
    inputs:
      since:
        description: "Only pull permits ISSUEDDATE >= this (YYYY-MM-DD). Blank = last 90 days."
        required: false
        default: ""

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute lookback window
        id: window
        run: |
          SINCE="${{ github.event.inputs.since }}"
          if [ -z "$SINCE" ]; then
            SINCE=$(date -u -d '90 days ago' +%Y-%m-%d)
          fi
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "Refreshing Harris permits since $SINCE"

      - name: Pull new commercial-building permits (owner-filled)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m scripts.scrape_harris_commercial --since "${{ steps.window.outputs.since }}" --apply

      - name: Refresh warehouse-named permits (mark warehouse)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m scripts.scrape_harris_permits \
            --where "(PROJECTNAME LIKE '%WAREHOUSE%' OR PROJECTNAME LIKE '%DISTRIBUTION%' OR PROJECTNAME LIKE '%LOGISTICS%' OR PROJECTNAME LIKE '%FULFILLMENT%' OR PROJECTNAME LIKE '%INDUSTRIAL%' OR PROJECTNAME LIKE '%COMMERCE PARK%' OR PROJECTNAME LIKE '%COMMERCE CENTER%' OR PROJECTNAME LIKE '%COLD STORAGE%' OR PROJECTNAME LIKE '%SPEC BUILDING%' OR PROJECTNAME LIKE '%FREIGHT%') AND ISSUEDDATE >= DATE '${{ steps.window.outputs.since }}'" \
            --mark-warehouse --apply

      - name: Re-run HCAD appraisal enrichment (pending -> matched over time)
        continue-on-error: true
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m scripts.enrich_from_hcad_parcels --apply

      - name: Report counts
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          from db import SessionLocal
          from models import Permit
          from sqlalchemy import func
          db = SessionLocal()
          har = db.query(func.count(Permit.id)).filter(Permit.source=='harris_county').scalar()
          wh = db.query(func.count(Permit.id)).filter(Permit.use_class=='warehouse', Permit.source=='harris_county').scalar()
          gen = db.query(func.count(Permit.id)).filter(Permit.use_class=='general', Permit.source=='harris_county').scalar()
          val = db.query(func.count(Permit.id)).filter(Permit.source=='harris_county', Permit.project_value.isnot(None)).scalar()
          print(f'Harris rows: {har} | warehouse: {wh} | general(pending): {gen} | with appraised value: {val}')
          "
